# Apenas o banco. O Nest roda na máquina (npm run start:dev).
# Isso NÃO é o bônus "Docker da aplicação" da avaliação.

services:
  postgres:
    image: postgres:16-alpine
    container_name: avaliacao-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Bind IPv4 no host. `localhost` no Windows às vezes resolve para ::1 (IPv6)
      # e o Prisma toma P1001 mesmo com o container healthy.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
